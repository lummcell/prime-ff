<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cek Prime FF · Kalkulator</title>
    <style>
        /* ───────────── RESET & BASE ───────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0a0e;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px;
            background: radial-gradient(ellipse at 20% 30%, #1a171f, #07060a);
        }

        /* ───────────── KARTU ───────────── */
        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(16, 14, 20, 0.92);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 40px;
            padding: 32px 24px 24px;
            border: 1px solid rgba(212, 175, 55, 0.20);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(212, 175, 55, 0.08), 0 0 60px rgba(212, 175, 55, 0.04);
            transition: border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(212, 175, 55, 0.35);
        }

        /* ───────────── LOGO PRIME (8-BIT / RETRO) ───────────── */
        .prime-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .prime-logo .icon-8bit {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #d4af37, #b8962e);
            width: 56px;
            height: 56px;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(212, 175, 55, 0.3), inset 0 -3px 0 #8a6f1e;
            font-size: 28px;
            font-weight: 900;
            color: #0b0a0e;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
            transform: rotate(-2deg);
            border: 2px solid rgba(255, 215, 80, 0.4);
            text-shadow: 1px 1px 0 #8a6f1e, 2px 2px 0 #6b5517;
        }

        .prime-logo .text-8bit {
            font-size: 30px;
            font-weight: 900;
            font-family: 'Courier New', monospace;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #f5e6b0, #d4af37, #f5e6b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 0 rgba(212, 175, 55, 0.2);
            transform: scaleY(0.95);
        }

        /* ───────────── HEADER ───────────── */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #f0eaff;
            letter-spacing: 0.5px;
        }

        .header h1 span {
            background: linear-gradient(135deg, #f5e6b0, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 13px;
            color: #8a7e96;
            margin-top: 6px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* ───────────── LABEL SEKSI ───────────── */
        .section-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .section-label .badge {
            background: linear-gradient(135deg, #d4af37, #b8962e);
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 700;
            color: #0b0a0e;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.15);
        }

        .section-label span {
            color: #b0a2bc;
            font-size: 14px;
            font-weight: 500;
        }

        /* ───────────── INPUT ───────────── */
        .input-wrap {
            position: relative;
            background: #12101a;
            border-radius: 20px;
            border: 1.5px solid #2a2538;
            transition: border 0.25s ease, box-shadow 0.3s ease;
            margin-bottom: 22px;
        }

        .input-wrap:focus-within {
            border-color: #d4af37;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.10), 0 0 30px rgba(212, 175, 55, 0.03);
        }

        .input-wrap input {
            width: 100%;
            padding: 18px 20px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 24px;
            font-weight: 700;
            color: #f0eaff;
            letter-spacing: 0.5px;
        }

        .input-wrap input::placeholder {
            color: #4d3f5e;
            font-weight: 500;
            font-size: 17px;
            letter-spacing: 0.3px;
        }

        /* ───────────── TOMBOL ───────────── */
        .btn-primary {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #d4af37, #b8962e);
            color: #0b0a0e;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.3s ease, background 0.3s;
            box-shadow: 0 6px 28px rgba(212, 175, 55, 0.25);
            border: 1px solid rgba(255, 215, 80, 0.15);
            margin-bottom: 24px;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 40px rgba(212, 175, 55, 0.35);
            background: linear-gradient(135deg, #e2c24a, #c9a132);
        }

        .btn-primary:active {
            transform: scale(0.96);
        }

        /* ───────────── KOTAK HASIL ───────────── */
        .result-box {
            background: #12101a;
            border-radius: 20px;
            padding: 20px 22px;
            border: 1px solid #2a2538;
            margin-bottom: 18px;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
        }

        .result-row:first-child {
            border-bottom: 1px solid #241e30;
            padding-bottom: 14px;
            margin-bottom: 10px;
        }

        .result-row .label {
            font-size: 15px;
            font-weight: 500;
            color: #9a86b0;
        }

        .result-row .value {
            font-size: 19px;
            font-weight: 700;
            color: #f0eaff;
        }

        .result-row .value.highlight {
            background: linear-gradient(135deg, #f5e6b0, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        /* ───────────── FOOTER DEV ───────────── */
        .footer-dev {
            text-align: center;
            margin-top: 6px;
            font-size: 13px;
            color: #4a4357;
            letter-spacing: 0.3px;
        }

        .footer-dev span {
            color: #d4af37;
            font-weight: 600;
        }

        /* ───────────── RESPONSIVE ───────────── */
        @media (max-width: 480px) {
            .card {
                padding: 22px 16px 18px;
            }

            .header h1 {
                font-size: 20px;
            }

            .prime-logo .icon-8bit {
                width: 44px;
                height: 44px;
                font-size: 22px;
            }

            .prime-logo .text-8bit {
                font-size: 24px;
            }

            .input-wrap input {
                font-size: 20px;
                padding: 16px 18px;
            }

            .result-row .value {
                font-size: 17px;
            }

            .btn-primary {
                font-size: 16px;
                padding: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- ─── LOGO PRIME 8-BIT ─── -->
        <div class="prime-logo">
            <div class="icon-8bit">P</div>
            <div class="text-8bit">PRIME</div>
        </div>

        <!-- ─── HEADER ─── -->
        <div class="header">
            <h1>Cek <span>Prime FF</span></h1>
            <p>Hitung kebutuhan Diamond &amp; estimasi harga Prime &amp; Booyah Pass</p>
        </div>

        <!-- ─── POIN PRIME ─── -->
        <div class="section-label">
            <span class="badge">Poin Prime</span>
            <span>KALKULATOR PRIME</span>
        </div>

        <!-- ─── INPUT (KOSONG) ─── -->
        <div class="input-wrap">
            <input
            type="number"
            id="primeInput"
            placeholder="Masukkan Poin Prime"
            min="0"
            step="1"
            />
        </div>

        <!-- ─── TOMBOL ─── -->
        <button class="btn-primary" id="calcBtn">HITUNG TOTAL HARGA</button>

        <!-- ─── HASIL ─── -->
        <div class="result-box">
            <div class="result-row">
                <span class="label">Total Diamond</span>
                <span class="value" id="totalDiamond">0</span>
            </div>
            <div class="result-row">
                <span class="label">Total Harga</span>
                <span class="value highlight" id="totalPrice">Rp 0</span>
            </div>
        </div>

        <!-- ─── DEV BY ─── -->
        <div class="footer-dev">
            DEV By <span>LummXd</span>
        </div>

    </div>

    <script>
        // ──────────────────────────────────────────────
        //  ELEMEN
        // ──────────────────────────────────────────────
        const inputEl = document.getElementById('primeInput');
        const calcBtn = document.getElementById('calcBtn');
        const diamondEl = document.getElementById('totalDiamond');
        const priceEl = document.getElementById('totalPrice');

        const PRICE_PER_DIAMOND = 126;

        // ──────────────────────────────────────────────
        //  FORMAT RUPIAH & ANGKA
        // ──────────────────────────────────────────────
        function formatRupiah(angka) {
            return 'Rp ' + angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        }

        function formatNumber(angka) {
            return angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        }

        // ──────────────────────────────────────────────
        //  HITUNG & TAMPILKAN
        // ──────────────────────────────────────────────
        function calculate() {
            let raw = inputEl.value.trim();
            if (raw === '') raw = '0';
            const points = parseInt(raw, 10);

            if (isNaN(points) || points < 0) {
                diamondEl.textContent = '0';
                priceEl.textContent = 'Rp 0';
                return;
            }

            const diamond = points;
            const totalPrice = points * PRICE_PER_DIAMOND;

            diamondEl.textContent = formatNumber(diamond);
            priceEl.textContent = formatRupiah(totalPrice);
        }

        // ──────────────────────────────────────────────
        //  EVENT LISTENER
        // ──────────────────────────────────────────────
        calcBtn.addEventListener('click', calculate);

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                calculate();
            }
        });
    </script>

</body>
</html>
